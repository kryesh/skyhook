[package]
name = "skyhook-cli"
description = "Shared terminal and batch host for Skyhook product binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "skyhook_cli"
path = "src/lib.rs"

[[bin]]
name = "skyhook"
path = "src/main.rs"
doc = false

[dependencies]
skyhook.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm = { version = "0.29", features = ["event-stream", "use-dev-tty"] }
dotenvy = "0.15"
futures-util.workspace = true
ignore.workspace = true
indexmap.workspace = true
libc = "0.2"
mimalloc.workspace = true
pulldown-cmark = { workspace = true, default-features = true }
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm_0_29",
    "layout-cache",
] }
rust-embed = { version = "8.12.0", features = [
    "include-exclude",
    "deterministic-timestamps",
] }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
syntect = { version = "5", default-features = false, features = [
    "default-fancy",
] }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
unicode-segmentation = "1"
unicode-width = "0.2"
zeroize.workspace = true

[dev-dependencies]
image.workspace = true
serde-saphyr.workspace = true
tempfile.workspace = true
