[package]
name = "skyhook-agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable runtime for the Skyhook programmable coding-agent harness"

[lib]
name = "skyhook"

[dependencies]
async-trait = "0.1.89"
base64 = "0.23"
chrono = { version = "0.4.42", default-features = false, features = [
    "clock",
    "serde",
] }
diffy = "0.5.1"
dom_smoothie = "0.18.1"
encoding_rs = "0.8"
fs2 = "0.4.3"
futures-util = "0.3.34"
getrandom = "0.4.3"
glob = "0.3.3"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
http = "1.5.0"
hyper-util = { version = "0.1.20", default-features = false, features = ["client-legacy", "client-proxy", "tokio"] }
ignore = "0.4.31"
jsonschema = { version = "0.55.1", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "json",
    "stream",
    "charset",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
] }
rquickjs = { version = "0.13", features = ["futures", "parallel"] }
rmcp = { version = "3.2.0", default-features = false, features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
rustls = { version = "0.23", default-features = false }
schemars = { version = "1.2.2", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11"
sse-stream = "0.2.6"
thiserror = "2.0.20"
tempfile = "3.24.0"
tokio = { version = "1.53.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.17", features = ["io"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = { version = "1.1.4", features = ["preserve_order"] }
tower-service = "0.3.3"
indexmap = { version = "2", features = ["serde"] }
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.53.1", features = ["test-util"] }
