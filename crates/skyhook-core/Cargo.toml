[package]
name = "skyhook-agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable runtime for the Skyhook programmable coding-agent harness"

[lib]
name = "skyhook"

[dependencies]
async-trait = "0.1.89"
base64 = "0.23"
chrono = { version = "0.4.42", default-features = false, features = [
    "clock",
    "serde",
] }
diffy = "0.5.1"
flux-core = { package = "codewandler-flux-core", version = "=0.59.3" }
flux-credentials = { package = "codewandler-flux-credentials", version = "=0.59.3" }
flux-provider = { package = "codewandler-flux-provider", version = "=0.59.3" }
flux-providers = { package = "codewandler-flux-providers", version = "=0.59.3" }
fs2 = "0.4.3"
futures-util = "0.3.34"
getrandom = "0.4.3"
glob = "0.3.3"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.31"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rquickjs = { version = "=0.12.2", features = ["futures", "parallel"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11"
thiserror = "2.0.20"
tempfile = "3.24.0"
tokio = { version = "1.53.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7.17"
toml = "1.1.4"
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
