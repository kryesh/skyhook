[package]
name = "skyhook"
description = "A programmable coding-agent harness with embedded JavaScript orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
getrandom.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
http.workspace = true
httpdate = "1"
indexmap.workspace = true
jsonschema.workspace = true
libc.workspace = true
libsql.workspace = true
reqwest.workspace = true
rmcp = { version = "3.7", default-features = false, features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_path = "0.7"
serde-saphyr.workspace = true
serde_with.workspace = true
skyhook-schema.workspace = true
skyhook-tools.workspace = true
skyhook-worker.workspace = true
skyhook-base.workspace = true
skyhook-media.workspace = true
sha2.workspace = true
# Must match rmcp's sse-stream minor version: its transport API exposes these types.
sse-stream = "0.2"
struson.workspace = true
tera.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
v8 = "152"
zeroize.workspace = true

[dev-dependencies]
image.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
