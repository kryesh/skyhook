[package]
name = "skyhook"
description = "A programmable coding-agent harness with embedded JavaScript orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
bytes = "1.12.1"
chrono.workspace = true
dom_query = "0.28.0"
dom_smoothie = "0.18.1"
encoding_rs = "0.8"
futures-util.workspace = true
getrandom.workspace = true
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# The version dom_query builds its tree with.
html5ever = "0.39.0"
http.workspace = true
httpdate = "1.0.3"
ignore.workspace = true
image.workspace = true
indexmap.workspace = true
jsonschema.workspace = true
libc = "0.2"
libsql.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "json",
    "stream",
    "charset",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "http2",
] }
rmcp = { version = "3.7", default-features = false, features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
rmp-serde = "1.3.1"
rquickjs = { version = "0.14", features = ["futures", "loader", "parallel"] }
rustls = { version = "0.23", default-features = false }
schemars.workspace = true
serde.workspace = true
serde_bytes = "0.11.19"
serde_json.workspace = true
serde_json_path = "0.7.2"
serde_path_to_error.workspace = true
serde-saphyr.workspace = true
serde_with.workspace = true
sha2.workspace = true
# Must match rmcp's sse-stream minor version: its transport API exposes these types.
sse-stream = "0.2.6"
struson = "0.7.2"
tempfile.workspace = true
tera.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The version image decodes PNGs with, to build fixtures image cannot encode.
png = "0.18"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
tokio = { version = "1.53.1", features = ["test-util"] }
