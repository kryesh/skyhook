# Additional settings for skyhook-security. Providers, credentials, and targets stay
# in config.yaml. Copy to ~/.config/skyhook/security.yaml (or the Skyhook directory
# under XDG_CONFIG_HOME), or to the workspace's .skyhook/security.yaml.
# --security-config PATH selects one file instead of discovering and layering them.

# References are configured provider/model names from config.yaml, not wire model IDs.
# Assignments become delegation hints, not mandatory bindings. Models without an
# assignment are not offered as explicit delegation choices.
models:
  main/reasoner:
    roles: [orchestrator, validator]
    hint: Cross-component reasoning, independent review, and coordination.
  main/reviewer:
    roles: [validator, reporter]
    hint: Independent analysis and evidence-led reports.
  local/coder:
    roles: [explorer, environment, poc]
    hint: Focused code exploration and authorized local test preparation.

# CVSS 4.0 severity threshold for the validation shortlist. An authenticated flaw with
# limited impact scores below high; use medium for web and other logic-heavy targets.
shortlist: high

# Omit poc to ask interactively and default to no in batch mode. An explicit ask
# requires an interactive session; use --poc yes/no when automating this example.
# poc: ask

# How many agents the orchestrator's scheduler runs at once. The default for a new
# run; the run persists it, and a later launch's --workers can change it. It is not a
# process sandbox or an enforced limit on spawned agents.
workers: 6

# Security MCP entries use the same shape as config.yaml and replace same-named
# servers from that file. All research modes with mcp can see the merged servers.
# mcp:
#   research:
#     transport: stdio
#     start_command: [/absolute/path/to/research-mcp]

# Embedded research modes replace ordinary config.yaml modes. A named override
# replaces the WHOLE mode: include its instructions and delegation hint as needed.
# The security guide lists each embedded mode's capabilities. To enable remote work,
# override the relevant child mode AND give its parent all capabilities that child needs.
# modes:
#   environment:
#     capabilities: [read, write, exec, network, mcp, targets, security.research]
#     instructions: |
#       Prepare only the authorized test environment. Record startup, endpoints,
#       credential references, and cleanup through the native environment tool.
#       Prefer disposable containers or deliberately configured targets.
#       Do not begin PoC attempts or claim empirical confirmation here.
#     hint: Prepare a reproducible, authorized test environment without exploitation.
