[package]
name = "skyhook-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/kryesh/skyhook"
description = "A programmable coding-agent harness with embedded JavaScript orchestration"
default-run = "skyhook"
autobins = false

[features]
tui = [
    "dep:clap",
    "dep:dotenvy",
    "dep:ratatui",
    "dep:crossterm",
    "dep:unicode-width",
    "dep:unicode-segmentation",
    "dep:pulldown-cmark",
    "dep:syntect",
]
shim-bin = []

[lib]
name = "skyhook"
path = "src/lib.rs"

[[bin]]
name = "skyhook"
path = "src/bin/skyhook/main.rs"
required-features = ["tui"]
doc = false

[[bin]]
name = "linux-ssh"
path = "src/bin/linux-ssh/main.rs"
required-features = ["shim-bin"]
test = false
bench = false
doc = false

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["tui"]

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.shim-release]
inherits = "release"
strip = "symbols"
opt-level = "z"
codegen-units = 1
lto = "fat"

[dependencies]
base64 = "0.23"
bytes = "1.12.1"
chrono = { version = "0.4.42", default-features = false, features = [
    "clock",
    "serde",
] }
diffy = "0.5.1"
dom_smoothie = "0.18.1"
encoding_rs = "0.8"
fs2 = "0.4.3"
futures-util = "0.3.34"
getrandom = "0.4.3"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
http = "1.5.0"
httpdate = "1.0.3"
hyper-util = { version = "0.1.20", default-features = false, features = [
    "client-legacy",
    "client-proxy",
    "tokio",
] }
ignore = "0.4.31"
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.56", default-features = false }
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
mimalloc = { version = "0.1", features = ["override"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "json",
    "stream",
    "charset",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "http2",
] }
rmcp = { version = "3.2.0", default-features = false, features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
rquickjs = { version = "0.13", features = ["futures", "parallel"] }
rust-embed = { version = "8.12.0", features = [
    "include-exclude",
    "deterministic-timestamps",
] }
rustls = { version = "0.23", default-features = false }
schemars = { version = "1.2.2", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11"
sse-stream = "0.2"
tempfile = "3.24.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.17", features = ["io"] }
toml = { version = "1.1.4", features = ["preserve_order"] }
tower-service = "0.3.3"
zeroize = "1.8.2"

# CLI-only dependencies.
clap = { version = "4", features = ["derive"], optional = true }
crossterm = { version = "0.29", features = [
    "event-stream",
    "use-dev-tty",
], optional = true }
dotenvy = { version = "0.15", optional = true }
pulldown-cmark = { version = "0.13", optional = true }
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm_0_29",
    "layout-cache",
], optional = true }
syntect = { version = "5", default-features = false, features = [
    "default-fancy",
], optional = true }
unicode-segmentation = { version = "1", optional = true }
unicode-width = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
tokio = { version = "1.53.1", features = ["test-util"] }
