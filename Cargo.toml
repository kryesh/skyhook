[workspace]
members = ["crates/skyhook-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://git.kryesh.tech/Apps/skyhook"

[package]
name = "skyhook-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A programmable coding-agent harness with embedded JavaScript orchestration"
default-run = "skyhook"
autobins = false
build = "build.rs"

[features]
default = ["embed-shims"]
embed-shims = []
shim-bin = []

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
mimalloc = { version = "0.1.52", features = ["override"] }
serde_json = "1.0.151"
skyhook = { package = "skyhook-agent-core", version = "=0.1.0", path = "crates/skyhook-core" }
tokio = { version = "1.53.1", features = [
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
] }

[[bin]]
name = "skyhook"
path = "src/bin/skyhook/main.rs"

[[bin]]
name = "skyhook-shim"
path = "src/bin/skyhook-shim/main.rs"
required-features = ["shim-bin"]
test = false
bench = false
doc = false

[profile.shim-release]
inherits = "release"
strip = "symbols"
opt-level = "z"
