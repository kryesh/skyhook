[workspace]
resolver = "2"
members = [
    "crates/skyhook",
    "crates/skyhook-cli",
    "crates/skyhook-security",
    "crates/linux-ssh",
]
default-members = ["crates/skyhook-cli", "crates/skyhook-security"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/kryesh/skyhook"

[workspace.dependencies]
skyhook = { path = "crates/skyhook" }
skyhook-cli = { path = "crates/skyhook-cli" }
base64 = "0.23"
chrono = { version = "0.4.42", default-features = false, features = [
    "clock",
    "serde",
] }
clap = { version = "4", features = ["derive", "string"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
http = "1.5.0"
ignore = "0.4.31"
image = { version = "0.25", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
indexmap = { version = "2", features = ["serde"] }
libsql = { version = "0.10", default-features = false, features = ["core"] }
mimalloc = { version = "0.1", features = ["override"] }
jsonschema = { version = "0.60", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
schemars = { version = "1", features = ["chrono04", "preserve_order"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serde_path_to_error = "0.1"
serde-saphyr = "2"
serde_with = { version = "3.21.0", default-features = false, features = [
    "macros",
] }
sha2 = "0.11"
tempfile = "3.24.0"
# preserve_order keeps context maps, such as a JSON-encoded one, in field order.
tera = { version = "2.4.0", default-features = false, features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.17", features = ["io", "rt"] }
zeroize = "1.8.2"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.shim-release]
inherits = "release"
strip = "symbols"
opt-level = "z"
codegen-units = 1
lto = "fat"
