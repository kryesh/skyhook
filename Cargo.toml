[workspace]
members = ["crates/skyhook-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/kryesh/skyhook"

[package]
name = "skyhook-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A programmable coding-agent harness with embedded JavaScript orchestration"
default-run = "skyhook"
autobins = false
build = "build.rs"

[features]
default = ["tui", "embed-shims"]
tui = [
    "dep:clap",
    "dep:dotenvy",
    "dep:ratatui",
    "dep:crossterm",
    "dep:futures-util",
    "dep:serde",
    "dep:toml",
    "dep:tempfile",
    "dep:unicode-width",
    "dep:unicode-segmentation",
    "dep:pulldown-cmark",
    "dep:syntect",
    "dep:base64",
    "dep:zeroize",
    "dep:serde_json",
]
embed-shims = ["dep:cargo-zigbuild", "dep:rust-embed"]
shim-bin = []

[build-dependencies]
cargo-zigbuild = { version = "0.23", default-features = false, optional = true }

[dependencies]
rust-embed = { version = "8.12.0", features = [
    "debug-embed",
    "include-exclude",
    "deterministic-timestamps",
], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
dotenvy = { version = "0.15", optional = true }
mimalloc = { version = "0.1", features = ["override"] }
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm_0_29",
    "layout-cache",
], optional = true }
crossterm = { version = "0.29", features = [
    "event-stream",
    "use-dev-tty",
], optional = true }
futures-util = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
unicode-width = { version = "0.2", optional = true }
unicode-segmentation = { version = "1", optional = true }
pulldown-cmark = { version = "0.13", optional = true }
syntect = { version = "5", default-features = false, features = [
    "default-fancy",
], optional = true }
base64 = { version = "0.23", optional = true }
zeroize = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
skyhook = { package = "skyhook-agent-core", path = "crates/skyhook-core" }
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "signal",
    "time",
    "process",
    "fs",
] }

[[bin]]
name = "skyhook"
path = "src/bin/skyhook/main.rs"
required-features = ["tui"]

[[bin]]
name = "linux-ssh"
path = "src/bin/linux-ssh/main.rs"
required-features = ["shim-bin"]
test = false
bench = false
doc = false

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.shim-release]
inherits = "release"
strip = "symbols"
opt-level = "z"
codegen-units = 1
lto = "fat"
