# The interface remembers the most recently selected model.
# With no saved selection, the first declared model below is used.
# Set to true to skip interactive approval for every tool call.
approve_all = false
# Enables remote-target tools, arguments, JavaScript APIs, and prompt guidance.
targets_enabled = false

[providers.openai]
kind = "openai"
base_url = "https://api.openai.com/v1"
api = "responses"
api_key_env = "OPENAI_API_KEY"

[providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"

# Run `skyhook auth login` (or `skyhook auth login --headless`) first.
# Credentials belong to Skyhook; official Codex client credentials are never accessed.
[providers.codex]
kind = "codex"

# Keyless local endpoint example:
[providers.local]
kind = "openai"
base_url = "http://127.0.0.1:11434/v1"
api = "chat_completions"

[models.openai]
provider = "openai"
model = "gpt-5.6"
reasoning = "high"
max_context = 128000
max_output = 16384
supports_images = true

[models.sonnet]
provider = "anthropic"
model = "claude-sonnet-4-6"
reasoning = "high"
max_context = 128000
max_output = 16384
supports_images = true

[models.codex]
provider = "codex"
model = "gpt-5.6-sol"
reasoning = "high"
max_context = 128000
max_output = 16384
supports_images = true

[models.local]
provider = "local"
model = "qwen3-coder"
max_context = 128000
max_output = 16384
supports_images = false

# Importing concrete aliases from ~/.ssh/config is opt-in.
[targets]
import_ssh_config = false

